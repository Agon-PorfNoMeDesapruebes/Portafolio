<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ perfil.nombre ~ " | Portafolio" if perfil else "Portafolio" }}{% endblock %}</title>
  <meta name="description" content="Portafolio personal: proyectos, habilidades y certificados.">

  <!-- Favicon (también se usa como logo en la cabecera) -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">

  <!-- Fuentes de Google Fonts: Space Grotesk (títulos) e Inter (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Íconos de Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- Marca que hay JavaScript: lo usan las animaciones de style.css.
       Red de seguridad: si main.js no llega a cargar, a los 3 segundos se
       quita la marca y el contenido se muestra igual (sin animaciones). -->
  <script>
    document.documentElement.classList.add("js");
    setTimeout(function () {
      if (!window.mainCargado) document.documentElement.classList.remove("js");
    }, 3000);
  </script>
</head>
<body>
  <header class="cabecera">
    <a class="logo" href="#inicio">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="34" height="34">
      <span>{{ perfil.nombre if perfil else "Portafolio" }}</span>
    </a>

    <button class="menu-boton" type="button" aria-label="Abrir menú" aria-expanded="false">
      <span aria-hidden="true">&#9776;</span>
    </button>

    <nav class="menu" aria-label="Principal">
      <a href="#proyectos">Proyectos</a>
      <a href="#habilidades">Habilidades</a>
      <a href="#certificados">Certificados</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="pie">
    <p>&copy; {{ perfil.nombre if perfil else "Portafolio" }}</p>
    <p><a href="#inicio">Volver arriba <i class="fa-solid fa-arrow-up"></i></a></p>
  </footer>

  <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</body>
</html>

{% extends "admin/layout.html" %}
{% block content %}
  <h1>{{ titulo }}</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    <p>{{ form.nombre.label }} {{ form.nombre() }}</p>
    {% for e in form.nombre.errors %}<small>{{ e }}</small>{% endfor %}
    <p>{{ form.submit() }} <a href="{{ url_for('admin.categorias_lista') }}">Cancelar</a></p>
  </form>
{% endblock %}

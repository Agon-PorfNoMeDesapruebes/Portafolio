{% extends "admin/layout.html" %}
{% block content %}
  <h1>Mensaje de {{ mensaje.nombre }}</h1>
  <p>
    <strong>Email:</strong>
    <a href="mailto:{{ mensaje.email }}">{{ mensaje.email }}</a><br>
    <strong>Fecha:</strong> {{ mensaje.fecha.strftime("%d/%m/%Y %H:%M") }}
  </p>
  <p style="white-space: pre-wrap">{{ mensaje.texto }}</p>
  <p><a href="{{ url_for('admin.mensajes_lista') }}">Volver a la lista</a></p>
{% endblock %}
